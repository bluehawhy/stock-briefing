x-build: &build
  context: .
  args:
    BUILD_TIME: ${BUILD_TIME:-}
    BUILD_COMMIT: ${BUILD_COMMIT:-unknown}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: *build
    env_file: .env
    environment:
      DASHBOARD_ALLOW_HTTP_PRIVATE: "1"
    volumes:
      - ./:/data
      - ${BROKER_SECRETS_DIR:-../stock-briefing-secrets}:/run/stock-briefing-secrets:ro
    logging: *logging
    networks:
      default:
      stock-proxy:
        aliases:
          - stock-api
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped
  telegram:
    build: *build
    env_file: .env
    command: ["python", "-m", "app.cli", "poll"]
    volumes:
      - ./:/data
      - ${BROKER_SECRETS_DIR:-../stock-briefing-secrets}:/run/stock-briefing-secrets:ro
    logging: *logging
    restart: unless-stopped
  worker:
    build: *build
    env_file: .env
    command: ["python", "-m", "app.cli", "run-daily"]
    volumes:
      - ./:/data
      - ${BROKER_SECRETS_DIR:-../stock-briefing-secrets}:/run/stock-briefing-secrets:ro
    logging: *logging
    profiles: ["job"]

networks:
  stock-proxy:
    external: true
    name: stock-proxy
