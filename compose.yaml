services:
  api:
    build: .
    env_file: .env
    volumes:
      - ./:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  telegram:
    build: .
    env_file: .env
    command: ["python", "-m", "app.cli", "poll"]
    volumes:
      - ./:/data
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.cli", "send-briefing"]
    volumes:
      - ./:/data
    profiles: ["job"]
