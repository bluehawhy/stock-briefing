[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-briefing"
version = "0.1.0"
description = "Messaging transports for a private stock briefing service"
requires-python = ">=3.13"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]
